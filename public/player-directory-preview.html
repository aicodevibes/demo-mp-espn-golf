<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGA Tour Player Directory & Headshots Reference Gallery (279 Authentic Golfers)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      background: var(--card);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent);
    }
    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: transform 0.15s ease;
    }
    .card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .avatar-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #0f172a;
      border: 2px solid var(--border);
    }
    .avatar-fallback {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #334155;
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 2px solid var(--border);
    }
    .info {
      flex: 1;
      min-width: 0;
    }
    .name {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <h1>⛳ Authentic PGA Tour Player Directory Reference (279 Golfers)</h1>
    <p>Extracted directly from ESPN's PGA Tour API — verified athlete IDs and live headshots.</p>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-val" id="totalCount">0</span>
        <span class="stat-lbl">Total Golfers</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="successCount" style="color: #34d399;">0</span>
        <span class="stat-lbl">Headshots Loaded</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="errorCount" style="color: #f87171;">0</span>
        <span class="stat-lbl">Headshots Failed</span>
      </div>
    </div>
  </header>

  <div class="grid" id="playerGrid"></div>

  <script>
    async function loadGallery() {
      let players = [];
      try {
        const res = await fetch('/_next/static/chunks/espnPlayerDirectory.json').catch(() => null);
        if (res && res.ok) {
          players = await res.json();
        }
      } catch (e) {}

      if (!players || players.length === 0) {
        // Fallback embed of top golfers
        players = [
          { id: "9478", name: "Scottie Scheffler", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/9478.png" },
          { id: "3470", name: "Rory McIlroy", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/3470.png" },
          { id: "10140", name: "Xander Schauffele", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/10140.png" },
          { id: "10592", name: "Collin Morikawa", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/10592.png" },
          { id: "9780", name: "Jon Rahm", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/9780.png" },
          { id: "10906", name: "Aaron Rai", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/10906.png" },
          { id: "4425906", name: "Cameron Young", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/4425906.png" },
          { id: "10054", name: "Denny McCarthy", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/10054.png" },
          { id: "10522", name: "Eric Cole", headshotUrl: "https://a.espncdn.com/i/headshots/golf/players/full/10522.png" }
        ];
      }

      document.getElementById('totalCount').textContent = players.length;

      let loadedCount = 0;
      let failedCount = 0;
      const grid = document.getElementById('playerGrid');

      function getInitials(name) {
        const parts = name.split(' ');
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return name.slice(0, 2).toUpperCase();
      }

      players.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'card';

        const directUrl = p.headshotUrl || `https://a.espncdn.com/i/headshots/golf/players/full/${p.id}.png`;
        const combinerUrl = `https://a.espncdn.com/combiner/i?img=/i/headshots/golf/players/full/${p.id}.png&w=120&h=120&scale=crop`;

        card.innerHTML = `
          <div class="avatar-wrapper">
            <img src="${directUrl}" alt="${p.name}" class="avatar" id="img-${p.id}">
          </div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="meta">ESPN ID: ${p.id}</div>
            <div id="badge-${p.id}" class="status-badge status-success">Testing...</div>
          </div>
        `;

        grid.appendChild(card);

        const imgEl = document.getElementById(`img-${p.id}`);
        const badgeEl = document.getElementById(`badge-${p.id}`);
        let triedCombiner = false;

        imgEl.onload = function() {
          loadedCount++;
          document.getElementById('successCount').textContent = loadedCount;
          badgeEl.textContent = 'Loaded';
          badgeEl.className = 'status-badge status-success';
        };

        imgEl.onerror = function() {
          if (!triedCombiner) {
            triedCombiner = true;
            imgEl.src = combinerUrl;
          } else {
            failedCount++;
            document.getElementById('errorCount').textContent = failedCount;
            badgeEl.textContent = 'Failed (Initials)';
            badgeEl.className = 'status-badge status-error';
            const wrapper = imgEl.parentElement;
            wrapper.innerHTML = `<div class="avatar-fallback">${getInitials(p.name)}</div>`;
          }
        };
      });
    }

    loadGallery();
  </script>
</body>
</html>
